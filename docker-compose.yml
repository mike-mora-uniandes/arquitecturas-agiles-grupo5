services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: solventa-event-bus
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq-setup:
    image: curlimages/curl:8.10.1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - ./definitions.json:/definitions.json:ro
    entrypoint: >
      curl -sf -u ${RABBITMQ_USER}:${RABBITMQ_PASSWORD}
      -H "Content-Type: application/json"
      -X POST http://rabbitmq:15672/api/definitions
      --data @/definitions.json

  notificaciones:
    build: ./ms-notificaciones
    container_name: solventa-ms-notificaciones
    depends_on:
      rabbitmq-setup:
        condition: service_completed_successfully
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    restart: on-failure

volumes:
  rabbitmq_data:
