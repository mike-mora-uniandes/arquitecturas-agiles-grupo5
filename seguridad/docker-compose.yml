# Orquestación local del experimento de seguridad (confidencialidad +
# integridad). Requisito previo: construir la imagen base con
# sh build-base.sh (equivale a:
#   docker build -t solventa/security-flask-base:latest ./base-image )
#
# Puertos de host distintos a los de backend/ (experimento 1) a propósito,
# para poder levantar ambos stacks al mismo tiempo sin choques.

name: solventa-seguridad

x-ms-common: &ms-common
  env_file: .env
  restart: "no"        # si un servicio falla, que quede visible, no en bucle

services:

  # ----------------------------- Infraestructura -----------------------------

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5673:5672"     # AMQP
      - "15673:15672"   # consola de administración

  ms-identidad-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: solventa
      POSTGRES_PASSWORD: solventa
      POSTGRES_DB: identidad
    ports:
      - "5433:5432"

  ms-riesgo-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: solventa
      POSTGRES_PASSWORD: solventa
      POSTGRES_DB: perfilriesgo
    ports:
      - "5434:5432"

  ms-audit-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: solventa
      POSTGRES_PASSWORD: solventa
      POSTGRES_DB: audit
    ports:
      - "5435:5432"

  seed:
    # Puebla ms-identidad-db y ms-riesgo-db con datos dummy (Faker). One-shot.
    <<: *ms-common
    build: ./seed
    depends_on:
      - ms-identidad-db
      - ms-riesgo-db
      - ms-audit-db

  # ----------------------------- Microservicios -----------------------------

  ms-identidad:
    <<: *ms-common
    build: ./ms-identidad
    environment:
      OTEL_SERVICE_NAME: ms-identidad
    ports:
      - "6001:5000"
    depends_on:
      - rabbitmq
      - ms-identidad-db
      - seed

  ms-cliente:
    <<: *ms-common
    build: ./ms-cliente
    environment:
      OTEL_SERVICE_NAME: ms-cliente
    ports:
      - "6002:5000"
    depends_on:
      - ms-identidad
      - ms-riesgo

  ms-riesgo:
    <<: *ms-common
    build: ./ms-riesgo
    environment:
      OTEL_SERVICE_NAME: ms-riesgo
    ports:
      - "6003:5000"
    depends_on:
      - rabbitmq
      - ms-riesgo-db
      - seed

  ms-audit:
    <<: *ms-common
    build: ./ms-audit
    environment:
      OTEL_SERVICE_NAME: ms-audit
    ports:
      - "6004:5000"
    depends_on:
      - rabbitmq
      - ms-audit-db

  ms-notificaciones:
    <<: *ms-common
    build: ./ms-notificaciones
    environment:
      OTEL_SERVICE_NAME: ms-notificaciones
    ports:
      - "6005:5000"
    depends_on:
      - rabbitmq

  # ------------------- Observabilidad (perfil "experimento") -----------------
  # Solo se levantan con `docker compose --profile experimento up`. El stack
  # base (sin este perfil) corre el flujo funcional sin métricas. Mismo patrón
  # y mismas imágenes que ../backend/ (experimento 1); puertos de host
  # distintos para poder correr ambos experimentos a la vez.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    profiles: ["experimento"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observabilidad/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4319:4318"     # OTLP http (4318 lo usa el experimento 1)
      - "9465:9464"     # métricas expuestas para Prometheus

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["experimento"]
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["experimento"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
