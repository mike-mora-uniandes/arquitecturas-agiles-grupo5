# Configuración mínima del caché de datos externos (MS PerfilRiesgo).
bind 0.0.0.0
protected-mode no
port 6379

# El caché es un valor de respaldo, no la fuente de verdad: si Redis se
# reinicia y pierde datos, PerfilRiesgo simplemente lo repuebla.
save ""
appendonly no

maxmemory 128mb
maxmemory-policy allkeys-lru
