# Configuración mínima del caché de datos externos (MS PerfilRiesgo).
bind 0.0.0.0
protected-mode no
port 6379

# El caché es efímero: si Redis se reinicia y pierde datos, se repuebla con el
# seed en el siguiente 'docker compose --profile experimento up'.
save ""
appendonly no

# 'noeviction': el caché es el valor de respaldo de ASR2; no debe descartarse un
# respaldo por presión de memoria (fallaría en silencio). Si se llena, la
# escritura falla de forma visible.
maxmemory 128mb
maxmemory-policy noeviction
