# Orquestación local del backend de Solventa.
# Requisito previo: construir la imagen base con  sh build-base.sh
# (equivale a:  docker build -t solventa/flask-base:latest ./base-image)
#
# Modo normal:      docker compose up
# Modo experimento: docker compose --profile experimento up   (repuebla Redis)

name: solventa-backend

x-ms-common: &ms-common
  env_file: .env
  restart: "no"        # si un servicio falla, que quede visible, no en bucle

x-ms-healthcheck: &ms-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 15s

services:

  # ----------------------------- Infraestructura -----------------------------

  rabbitmq:
    # Por ahora imagen oficial; si se necesitan definiciones de colas / plugins
    # propias, se cambia a  build: ./rabbitmq
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # consola de administración
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    # Caché de datos externos de MS PerfilRiesgo (ASR2).
    build: ./redis
    image: solventa/redis:latest
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis-seed:
    # Prepobla el caché con los perfiles de prueba (backend/redis/seed).
    # Idempotente: se re-ejecuta en cada 'docker compose --profile experimento up'.
    image: redis:7-alpine
    profiles: ["experimento"]
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./redis/seed:/seed:ro
    entrypoint: ["sh", "-c", "redis-cli -h redis < /seed/profiles.redis && echo 'redis-seed OK'"]

  wiremock:
    # Simula Open Data / Open Finance. Aún sin mappings.
    image: wiremock/wiremock:3.9.2
    ports:
      - "8080:8080"

  # --- Observabilidad y carga (perfil 'experimento') ---
  # Los servicios otel-collector, grafana y locust se declararán aquí bajo
  # 'profiles: ["experimento"]' cuando su configuración esté lista
  # (ver backend/observabilidad/).

  # ----------------------------- Microservicios -----------------------------

  ms-riesgos:
    <<: *ms-common
    # Solo el andamiaje para que compose levante; sin lógica de negocio.
    build: ./ms-riesgos
    environment:
      OTEL_SERVICE_NAME: ms-riesgos
    ports:
      - "5001:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck: *ms-healthcheck

  ms-perfil-riesgo:
    <<: *ms-common
    # Estructura base; sin lógica de ASR1/2/3 todavía.
    build: ./ms-perfil-riesgo
    environment:
      OTEL_SERVICE_NAME: ms-perfil-riesgo
    ports:
      - "5002:5000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      wiremock:
        condition: service_started
    healthcheck: *ms-healthcheck

  ms-notificaciones:
    <<: *ms-common
    # Solo el andamiaje; sin lógica de negocio.
    build: ./ms-notificaciones
    environment:
      OTEL_SERVICE_NAME: ms-notificaciones
    ports:
      - "5003:5000"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck: *ms-healthcheck
